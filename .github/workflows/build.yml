name: Build TWRP Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CCACHE_DIR: ~/.ccache
      USE_CCACHE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libncurses-dev \
            libssl-dev \
            libtinfo5 \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install latest repo launcher
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          ccache -M 20G

      - name: Initialize source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b android-12.1 \
            --depth=1

      - name: Sync source
        run: |
          cd ~/twrp

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --current-branch \
            -j$(nproc)

      - name: Clone device tree
        run: |
          cd ~/twrp

          git clone \
            https://github.com/prablordeppey/android_device_doogee_S100Pro.git \
            generic/vendor_boot

      - name: Build recovery
        run: |
          cd ~/twrp

          source build/envsetup.sh

          lunch omni_vendor_boot-eng || \
          lunch omni_vendor_boot-userdebug

          mka vendorbootimage -j$(nproc)

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: twrp-images
          path: |
            ~/twrp/out/target/product/**/*.img
